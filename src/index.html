    <!-- prévia ao compartilhar o link (LinkedIn, WhatsApp, X…).

    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="gustavo.dev" />
    <meta property="og:title" content="Gustavo Domingos · Desenvolvedor backend" />
    <meta
      property="og:description"
      content="Estudante de ADS no IFSP com foco em backend: APIs REST com Node.js e TypeScript, Java e MySQL."
    />
    <meta property="og:url" content="https://gustavo-domingos.vercel.app/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600&family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- aplica o tema antes da primeira pintura para não piscar -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('gd-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
